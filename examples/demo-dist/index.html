            <button type="button" onclick="addRowToTableBlock(${idx})" class="h-7 px-2.5 rounded-md border gb-border-strong hover:border-emerald-500 text-[11px] font-medium">
              + Thêm dòng
            </button>
            <button type="button" onclick="removeRowFromTableBlock(${idx})" class="h-7 px-2.5 rounded-md border gb-border-strong hover:border-rose-500 text-[11px] font-medium">
              - Xóa dòng
            </button>
          ` : ""}
        </div>
        <div class="flex items-center gap-2 ml-auto">
          <span class="hidden sm:inline text-[11px] text-slate-400">⌘S lưu · Esc hủy</span>
          <button type="button" onclick="commitBlockEdit(${idx})" class="h-7 px-3 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-semibold">
            Lưu đoạn này
          </button>
          <button type="button" onclick="cancelBlockEdit(${idx})" class="h-7 px-2.5 rounded-lg border gb-border-strong text-slate-500">
            Hủy
          </button>
        </div>
      `;

      block.insertAdjacentElement("beforebegin", toolbar);
      const editableTarget = isTableBlock ? (block.querySelector("table") || block) : block;
      editableTarget.setAttribute("contenteditable", "true");
      editableTarget.onkeydown = (ev) => {
        if (ev.key === "Escape") {
          ev.preventDefault();
          cancelBlockEdit(idx);
        } else if ((ev.metaKey || ev.ctrlKey) && (ev.key.toLowerCase() === "s" || ev.key === "Enter")) {
          ev.preventDefault();
          commitBlockEdit(idx);
        }
      };
      block.classList.add("gb-block-editing");
      editableTarget.focus();
    }

    function execWysiwygCmd(cmd) {
      document.execCommand(cmd, false, null);
    }

    function execInlineCodeWrap() {
      const sel = window.getSelection();
      if (!sel || !sel.rangeCount) return;
      const text = sel.toString();
      if (!text) return;
      document.execCommand("insertHTML", false, `<code>${text}</code>`);
    }

    function addRowToTableBlock(idx) {
      const blocks = getEditableBlockElements();
      const block = blocks[idx];
      if (!block) return;
      const tbody = block.querySelector("tbody") || block.querySelector("table");
      if (!tbody) return;
      const lastRow = tbody.querySelector("tr:last-child");
      if (!lastRow) return;
      const newRow = lastRow.cloneNode(true);
      newRow.querySelectorAll("td, th").forEach((cell) => {
        cell.textContent = "Nội dung mới";
      });
      tbody.appendChild(newRow);
    }

    function removeRowFromTableBlock(idx) {
      const blocks = getEditableBlockElements();
      const block = blocks[idx];
      if (!block) return;
      const tbody = block.querySelector("tbody");
      if (!tbody || tbody.querySelectorAll("tr").length <= 1) return;
      const lastRow = tbody.querySelector("tr:last-child");
      if (lastRow) lastRow.remove();
    }

    async function commitBlockEdit(idx) {
      const blocks = getEditableBlockElements();
      const block = blocks[idx];
      if (!block) return;
      const articleEl = document.getElementById("gitbook-article");
      const toolbar = articleEl.querySelector(`.gb-wysiwyg-toolbar[data-for-block="${idx}"]`);
      if (toolbar) toolbar.remove();

      delete block.dataset.editingActive;
      delete block.dataset.originalHtml;
      block.classList.remove("gb-block-editing");
      block.removeAttribute("contenteditable");
      const tbl = block.querySelector("table");
      if (tbl) tbl.removeAttribute("contenteditable");

      decorateEditableBlocks();
      await saveEditedMarkdown(true);
    }

    function cancelBlockEdit(idx) {
      const blocks = getEditableBlockElements();
      const block = blocks[idx];
      if (!block) return;
      const articleEl = document.getElementById("gitbook-article");
      const toolbar = articleEl.querySelector(`.gb-wysiwyg-toolbar[data-for-block="${idx}"]`);
      if (toolbar) toolbar.remove();

      if (block.dataset.originalHtml !== undefined) {
        block.innerHTML = block.dataset.originalHtml;
      }
      delete block.dataset.editingActive;
      delete block.dataset.originalHtml;
      block.classList.remove("gb-block-editing");
      block.removeAttribute("contenteditable");
      const tbl = block.querySelector("table");
      if (tbl) tbl.removeAttribute("contenteditable");

      decorateEditableBlocks();
    }

    const flowCanvasStates = {};

    function cleanMermaidLabelText(s) {
      return String(s || "").replace(/<br\s*\/?>/gi, " ").replace(/\s+/g, " ").trim();
    }

    function wrapMermaidLabelText(s) {
      const words = cleanMermaidLabelText(s).split(" ").filter(Boolean);
      if (words.length <= 8) return words.join(" ");
      const mid = Math.ceil(words.length / 2);
      return `${words.slice(0, mid).join(" ")}<br/>${words.slice(mid).join(" ")}`;
    }

    function parseMermaidToFlowGraph(rawCode) {
      const lines = String(rawCode || "").split(/\r?\n/);
      let kind = "flowchart";
      let direction = "TB";
      if (/^\s*sequenceDiagram\b/m.test(rawCode)) {
        kind = "sequence";
        direction = "LR";
      } else if (/^\s*stateDiagram(?:-v2)?\b/m.test(rawCode)) {
        kind = "state";
        direction = "TB";
      } else if (/\b(?:flowchart|graph)\s+LR\b/i.test(rawCode)) {
        direction = "LR";
      }

      const nodesMap = new Map();
      const subgraphs = [];
      const edges = [];
      let currentSg = null;
      const reserved = new Set(["flowchart", "graph", "subgraph", "end", "direction", "TB", "TD", "LR", "RL", "BT", "sequenceDiagram", "stateDiagram", "stateDiagram-v2", "participant", "actor", "state", "as"]);

      function ensureNode(id, label, shape = "rect", sgId = currentSg) {
        const cleanId = String(id || "").trim();
        if (!cleanId || reserved.has(cleanId)) return null;
        if (!nodesMap.has(cleanId)) {
          nodesMap.set(cleanId, {
            id: cleanId,
            label: cleanMermaidLabelText(label || cleanId),
            shape: shape || "rect",
            subgraphId: sgId || null,
            x: 0,
            y: 0,
            w: 184,
            h: 54
          });
          if (sgId) {
            const sg = subgraphs.find((s) => s.id === sgId);
            if (sg && !sg.nodeIds.includes(cleanId)) sg.nodeIds.push(cleanId);
          }
        } else {
          const n = nodesMap.get(cleanId);
          if (label && n.label === cleanId) n.label = cleanMermaidLabelText(label);
          if (shape && shape !== "rect") n.shape = shape;
          if (sgId && !n.subgraphId) {
            n.subgraphId = sgId;
            const sg = subgraphs.find((s) => s.id === sgId);
            if (sg && !sg.nodeIds.includes(cleanId)) sg.nodeIds.push(cleanId);
          }
        }
        return nodesMap.get(cleanId);
      }

      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line || line.startsWith("%%")) continue;

        const sgMatch = line.match(/^subgraph\s+([A-Za-z0-9_]+)\s*(?:\[\s*"([^"]+)"\s*\])?/i);
        if (sgMatch) {
          const sgId = sgMatch[1];
          const sgTitle = cleanMermaidLabelText(sgMatch[2] || sgId);
          subgraphs.push({ id: sgId, title: sgTitle, nodeIds: [] });
          currentSg = sgId;
          continue;
        }
        if (/^end\b/i.test(line)) {
          currentSg = null;
          continue;
        }

        const stateMatch = line.match(/^state\s+"([^"]+)"\s+as\s+([A-Za-z0-9_]+)/i);
        if (stateMatch) {
          ensureNode(stateMatch[2], stateMatch[1], "rounded");
          continue;
        }

        const partMatch = line.match(/^(?:participant|actor)\s+([A-Za-z0-9_]+)(?:\s+as\s+(.+))?$/i);
        if (partMatch) {
          ensureNode(partMatch[1], partMatch[2] || partMatch[1], "rect");
          continue;
        }

        // Extract inline node declarations (both quoted and unquoted) and replace with node ID
        let workingLine = line.replace(
          /\b([A-Za-z0-9_]+)\s*(?:\(\[\s*"?([^"\]]+)"?\s*\]\)|\[\(\s*"?([^"\)]+)"?\s*\)\]|\{\{\s*"?([^"\}]+)"?\s*\}\}|\{\s*"?([^"\}]+)"?\s*\}|\[\s*"?([^"\]]+)"?\s*\])/g,
          (_, id, stLbl, cylLbl, hexLbl, diaLbl, rectLbl) => {
            if (stLbl !== undefined) ensureNode(id, stLbl, "stadium");
            else if (cylLbl !== undefined) ensureNode(id, cylLbl, "cylinder");
            else if (hexLbl !== undefined || diaLbl !== undefined) ensureNode(id, hexLbl || diaLbl, "diamond");
            else if (rectLbl !== undefined) ensureNode(id, rectLbl, "rect");
            return id;
          }
        );

        // Sequence edge
        if (kind === "sequence") {
          const seqEdge = line.match(/^([A-Za-z0-9_]+)\s*(->>|-->>|->|-->)\s*([A-Za-z0-9_]+)\s*:\s*(.+)$/);
          if (seqEdge) {
            const fromId = seqEdge[1];
            const arrow = seqEdge[2];
            const toId = seqEdge[3];
            const msg = cleanMermaidLabelText(seqEdge[4]);
            ensureNode(fromId, fromId);
            ensureNode(toId, toId);
            edges.push({ id: `e${edges.length + 1}`, from: fromId, to: toId, label: msg, arrow });
            continue;
          }
        }

        // Normalize "-- label -->", "-. label .->", "== label ==>", and stateDiagram ": label"
        workingLine = workingLine
          .replace(/--\s*"?([^"->]+?)"?\s*-->/g, "-->|$1|")
          .replace(/-\.\s*"?([^".>]+?)"?\s*\.->/g, "-.->|$1|")
          .replace(/==\s*"?([^"=>]+?)"?\s*==>/g, "==>|$1|");

        if (kind === "state") {
          workingLine = workingLine.replace(
            /([A-Za-z0-9_]+|\[\*\])\s*(-->)\s*([A-Za-z0-9_]+|\[\*\])\s*:\s*(.+)$/,
            "$1 $2|$4| $3"
          );
        }

        // Parse chained edges (A --> B --> C) and multi-node '&' groups (R1 & R2 --> B1, B4 --> O1 & O2)
        const arrowRegex = /\s*(-\.->|-->|==>|---)\s*(?:\|([^|]*)\|\s*)?/g;
        const arrowMatches = Array.from(workingLine.matchAll(arrowRegex));
        if (arrowMatches.length > 0) {
          const segments = [];
          segments.push(workingLine.slice(0, arrowMatches[0].index));
          for (let mi = 0; mi < arrowMatches.length; mi++) {
            const segStart = arrowMatches[mi].index + arrowMatches[mi][0].length;
            const segEnd = mi + 1 < arrowMatches.length ? arrowMatches[mi + 1].index : workingLine.length;
            segments.push(workingLine.slice(segStart, segEnd));
          }

          const parseNodeToken = (tok) => {
            const t = String(tok || "").trim();
            if (t === "[*]") return { id: null, isStar: true };
            const m = t.match(/^([A-Za-z0-9_]+)/);
            return m ? { id: m[1], isStar: false } : { id: null, isStar: false };
          };

          for (let mi = 0; mi < arrowMatches.length; mi++) {
            const arrow = arrowMatches[mi][1];
            const rawLbl = (arrowMatches[mi][2] || "").trim().replace(/^["']|["']$/g, "");
            const edgeLbl = cleanMermaidLabelText(rawLbl);
            const leftGroup = (segments[mi] || "").split("&").map(parseNodeToken).filter((x) => x.id || x.isStar);
            const rightGroup = (segments[mi + 1] || "").split("&").map(parseNodeToken).filter((x) => x.id || x.isStar);

            for (const uTok of leftGroup) {
              for (const vTok of rightGroup) {
                const fromId = uTok.isStar ? "START_STATE" : uTok.id;
                const toId = vTok.isStar ? "END_STATE" : vTok.id;
                ensureNode(fromId, uTok.isStar ? "Bắt đầu" : fromId, uTok.isStar ? "stadium" : "rect", null);
                ensureNode(toId, vTok.isStar ? "Kết thúc" : toId, vTok.isStar ? "stadium" : "rect", null);
                if (fromId && toId) {
                  edges.push({
                    id: `e${edges.length + 1}`,
                    from: fromId,
                    to: toId,
                    label: edgeLbl,
                    arrow
                  });
                }
              }
            }
          }
        }
      }

      const graph = {
        kind,
        direction,
        nodes: Array.from(nodesMap.values()),
        edges,
        subgraphs,
        selectedNodeId: null,
        selectedEdgeId: null
      };
      computeFlowGraphLayout(graph);
      return graph;
    }

    function computeFlowGraphLayout(graph) {
      const nodes = graph.nodes || [];
      if (!nodes.length) return;
      const ranks = new Map();
      const sgOrder = new Map();
      (graph.subgraphs || []).forEach((sg, idx) => sgOrder.set(sg.id, idx));

      nodes.forEach((n) => ranks.set(n.id, 0));

      const maxIter = Math.min(nodes.length + 4, 24);
      for (let iter = 0; iter < maxIter; iter++) {
        for (const e of graph.edges || []) {
          const ru = ranks.get(e.from) || 0;
          const rv = ranks.get(e.to) || 0;
          if (e.from !== e.to && rv < ru + 1) {
            ranks.set(e.to, Math.min(ru + 1, nodes.length + 2));
          }
        }
      }

      // Keep nodes in later subgraphs ordered below/after earlier subgraphs
      if (sgOrder.size > 1) {
        let minAllowedRank = 0;
        for (const sg of graph.subgraphs || []) {
          const sgNodes = nodes.filter((n) => n.subgraphId === sg.id);
          if (!sgNodes.length) continue;
          const curMin = Math.min(...sgNodes.map((n) => ranks.get(n.id) || 0));
          const shift = minAllowedRank > curMin ? (minAllowedRank - curMin) : 0;
          if (shift > 0) {
            sgNodes.forEach((n) => ranks.set(n.id, (ranks.get(n.id) || 0) + shift));
          }
          const newMax = Math.max(...sgNodes.map((n) => ranks.get(n.id) || 0));
          minAllowedRank = newMax + 1;
        }
      }

      const layers = new Map();
      nodes.forEach((n) => {
        const r = ranks.get(n.id) || 0;
        if (!layers.has(r)) layers.set(r, []);
        layers.get(r).push(n);
      });

      const sortedRanks = Array.from(layers.keys()).sort((a, b) => a - b);
      const nodeW = 180;
      const nodeH = 44;

      if (graph.direction === "LR") {
        let curX = 36;
        let prevSg = null;
        sortedRanks.forEach((r, colIdx) => {
          const colNodes = layers.get(r);
          const rowSg = colNodes[0] ? colNodes[0].subgraphId : null;
          if (colIdx > 0) {
            curX += (rowSg !== prevSg && (rowSg || prevSg)) ? 236 : 214;
          }
          prevSg = rowSg;
          colNodes.forEach((n, rowIdx) => {
            n.w = nodeW;
            n.h = nodeH;
            n.x = curX;
            n.y = 42 + rowIdx * 78;
          });
        });
      } else {
        let curY = 46;
        let prevSg = null;
        sortedRanks.forEach((r, rowIdx) => {
          const rowNodes = layers.get(r);
          const rowSg = rowNodes[0] ? rowNodes[0].subgraphId : null;
          if (rowIdx > 0) {
            curY += (rowSg !== prevSg && (rowSg || prevSg)) ? 124 : 84;
          }
          prevSg = rowSg;
          const colGap = 56;
          const totalW = rowNodes.length * nodeW + (rowNodes.length - 1) * colGap;
          const startX = Math.max(36, Math.round((700 - totalW) / 2));
          rowNodes.forEach((n, colIdx) => {
            n.w = nodeW;
            n.h = nodeH;
            n.x = startX + colIdx * (nodeW + colGap);
            n.y = curY;
          });
        });
      }
    }

    function serializeFlowGraphToMermaid(graph) {
      if (!graph || !graph.nodes.length) return "flowchart TB\n  A[\" Khởi tạo \"]";
      if (graph.kind === "sequence") {
        const lines = ["sequenceDiagram"];
        graph.nodes.forEach((n) => {
          lines.push(`    participant ${n.id} as ${cleanMermaidLabelText(n.label)}`);
        });
        graph.edges.forEach((e) => {
          lines.push(`    ${e.from}${e.arrow || "->>"}${e.to}: ${cleanMermaidLabelText(e.label || "Xử lý")}`);
        });
        return lines.join("\n");
      }

      const lines = [`flowchart ${graph.direction || "TB"}`];
      const renderedNodeIds = new Set();

      function formatNodeDef(n) {
        const safe = wrapMermaidLabelText(n.label).replace(/"/g, "'");
        if (n.shape === "diamond") return `${n.id}{"${safe}"}`;
        if (n.shape === "stadium") return `${n.id}(["${safe}"])`;
        if (n.shape === "cylinder") return `${n.id}[("${safe}")]`;
        return `${n.id}["${safe}"]`;
      }

      (graph.subgraphs || []).forEach((sg) => {
        const sgNodes = graph.nodes.filter((n) => n.subgraphId === sg.id);
        if (!sgNodes.length) return;
        lines.push(`    subgraph ${sg.id}["${cleanMermaidLabelText(sg.title).replace(/"/g, "'")}"]`);
        sgNodes.forEach((n) => {
          lines.push(`        ${formatNodeDef(n)}`);
          renderedNodeIds.add(n.id);
        });
        lines.push("    end");
      });

      graph.nodes.forEach((n) => {
        if (!renderedNodeIds.has(n.id)) {
          lines.push(`    ${formatNodeDef(n)}`);
          renderedNodeIds.add(n.id);
        }
      });

      (graph.edges || []).forEach((e) => {
        const arrow = e.arrow || "-->";
        if (e.label && e.label.trim()) {
          const safeLbl = cleanMermaidLabelText(e.label).replace(/\|/g, "/").replace(/"/g, "'");
          lines.push(`    ${e.from} ${arrow}|"${safeLbl}"| ${e.to}`);
        } else {
          lines.push(`    ${e.from} ${arrow} ${e.to}`);
        }
      });

      return lines.join("\n");
    }

    function syncGraphToMermaidTextarea(idx) {
      const graph = flowCanvasStates[idx];
      const ta = document.getElementById(`mmd-editor-${idx}`);
      if (!graph || !ta) return;
      ta.value = serializeFlowGraphToMermaid(graph);
    }

    function buildBezierPath(x1, y1, x2, y2, dir) {
      if (dir === "LR") {
        const dist = Math.abs(x2 - x1);
        const dx = Math.max(12, Math.min(48, dist * 0.42));
        return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
      }
      const dist = Math.abs(y2 - y1);
      const dy = Math.max(12, Math.min(48, dist * 0.42));
      if (Math.abs(x2 - x1) > 12 && y2 > y1 + 40) {
        const convergingToCenter = Math.abs(x1 - 350) >= Math.abs(x2 - 350);
        if (convergingToCenter) {
          const midDropY = Math.min(y2 - 22, y1 + Math.round((y2 - y1) * 0.52));
          return `M ${x1} ${y1} L ${x1} ${midDropY} C ${x1} ${y2 - 6}, ${x2} ${y2 - 22}, ${x2} ${y2}`;
        }
        const spreadY = Math.min(y2 - 12, y1 + Math.round((y2 - y1) * 0.48));
        return `M ${x1} ${y1} C ${x1} ${y1 + 20}, ${x2} ${spreadY - 18}, ${x2} ${spreadY} L ${x2} ${y2}`;
      }
      return `M ${x1} ${y1} C ${x1} ${y1 + dy}, ${x2} ${y2 - dy}, ${x2} ${y2}`;
    }

    function getNodePortCoords(node, port, dir) {
      const w = node.w || 180;
      const h = node.h || 44;
      if (dir === "LR") {
        return port === "in"
          ? { x: node.x, y: node.y + h / 2 }
          : { x: node.x + w, y: node.y + h / 2 };
      }
      return port === "in"
        ? { x: node.x + w / 2, y: node.y }
        : { x: node.x + w / 2, y: node.y + h };
    }

    function renderFlowCanvas(idx) {
      const stage = document.getElementById(`mmd-canvas-stage-${idx}`);
      const graph = flowCanvasStates[idx];
      if (!stage || !graph) return;

      let maxX = 720;
      let maxY = 540;
      graph.nodes.forEach((n) => {
        if (n.x + 220 > maxX) maxX = n.x + 220;
        if (n.y + 96 > maxY) maxY = n.y + 96;
      });
      stage.style.width = `${maxX}px`;
      stage.style.height = `${maxY}px`;

      // Compute subgraph bounding boxes
      const sgHtml = (graph.subgraphs || []).map((sg) => {
        const sgNodes = graph.nodes.filter((n) => n.subgraphId === sg.id);
        if (!sgNodes.length) return "";
        const rawMinX = Math.min(...sgNodes.map((n) => n.x)) - 20;
        const rawMaxX = Math.max(...sgNodes.map((n) => n.x + (n.w || 180))) + 20;
        const minX = graph.direction === "LR" ? rawMinX : Math.min(rawMinX, 224);
        const maxSgX = graph.direction === "LR" ? rawMaxX : Math.max(rawMaxX, 476);
        const minY = Math.min(...sgNodes.map((n) => n.y)) - 34;
        const maxSgY = Math.max(...sgNodes.map((n) => n.y + (n.h || 44))) + 14;
        return `
          <div class="gb-flow-subgraph-box" style="left:${minX}px;top:${minY}px;width:${maxSgX - minX}px;height:${maxSgY - minY}px;">
            <span class="gb-flow-subgraph-title">${sg.title}</span>
          </div>
        `;
      }).join("");

      const nodesById = new Map(graph.nodes.map((n) => [n.id, n]));
      let selectedEdgePopoverHtml = "";

      const edgesSvgGroups = (graph.edges || []).map((e) => {
        const u = nodesById.get(e.from);
        const v = nodesById.get(e.to);
        if (!u || !v) return "";
        const p1 = getNodePortCoords(u, "out", graph.direction);
        const p2 = getNodePortCoords(v, "in", graph.direction);
        const d = buildBezierPath(p1.x, p1.y, p2.x, p2.y, graph.direction);
        const midX = Math.round((p1.x + p2.x) / 2);
        const midY = Math.round((p1.y + p2.y) / 2);
        const isSelected = graph.selectedEdgeId === e.id;
        if (isSelected) {
          selectedEdgePopoverHtml = `
            <div class="gb-flow-edge-popover" style="left:${midX}px;top:${midY}px;" onpointerdown="event.stopPropagation()">
              <input
                type="text"
                value="${(e.label || "").replace(/"/g, "&quot;")}"
                placeholder="Nhãn..."
                oninput="updateFlowEdgeLabelInline(${idx}, '${e.id}', this.value)"
                class="w-28 h-5 px-1.5 rounded bg-slate-800 text-[11px] text-white border border-slate-700 focus:outline-none focus:border-emerald-400"
              />
              <button
                type="button"
                onclick="deleteFlowEdgeById(${idx}, '${e.id}', event)"
                title="Xóa mũi tên"
                class="h-5 px-1.5 rounded hover:bg-rose-500/30 text-rose-300 text-[11px]"
              >✕</button>
            </div>
          `;
        }
        return `
          <g class="gb-flow-edge-group ${isSelected ? 'selected' : ''}" onclick="selectFlowEdge(${idx}, '${e.id}', event)">
            <path class="gb-flow-edge-hit" d="${d}"></path>
            <path class="gb-flow-edge-path" d="${d}" marker-end="url(#gb-flow-arrow-${idx})"></path>
            ${e.label && !isSelected ? `
              <rect x="${midX - 46}" y="${midY - 9}" width="92" height="18" rx="4" fill="#0f172a" opacity="0.82"></rect>
              <text x="${midX}" y="${midY + 3}" text-anchor="middle" fill="#f8fafc" font-size="9.5">${e.label.slice(0, 18)}</text>
            ` : ""}
          </g>
        `;
      }).join("");

      const nodesHtml = graph.nodes.map((n) => {
        const isSelected = graph.selectedNodeId === n.id;
        const inStyle = graph.direction === "LR"
          ? "left:-6px;top:calc(50% - 6px);"
          : "top:-6px;left:calc(50% - 6px);";
        const outStyle = graph.direction === "LR"
          ? "right:-6px;top:calc(50% - 6px);"
          : "bottom:-6px;left:calc(50% - 6px);";
        const floatingToolbar = isSelected ? `
          <div class="gb-flow-node-toolbar" onpointerdown="event.stopPropagation()">
            <button type="button" onclick="addConnectedFlowNode(${idx}, '${n.id}', 'rect', event)" title="Nối thêm bước tiếp theo">
              <span>+ Bước</span>
            </button>
            <button type="button" onclick="addConnectedFlowNode(${idx}, '${n.id}', 'diamond', event)" title="Nối thêm rẽ nhánh">
              <span>◇ Nhánh</span>
            </button>
            <button type="button" onclick="startFlowNodeInlineEdit(${idx}, '${n.id}', event)" title="Sửa nội dung khối">
              <span>Sửa</span>
            </button>
            <button type="button" class="danger" onclick="deleteFlowNodeById(${idx}, '${n.id}', event)" title="Xóa khối này">
              <span>✕</span>
            </button>
          </div>
        ` : "";
        return `
          <div
            id="gb-fnode-${idx}-${n.id}"
            data-node-id="${n.id}"
            style="left:${n.x}px;top:${n.y}px;"
            title="${n.label.replace(/"/g, "&quot;")}"
            class="gb-flow-node ${n.shape === 'diamond' ? 'shape-diamond' : ''} ${isSelected ? 'selected' : ''}"
            onpointerdown="startFlowNodeDrag(${idx}, '${n.id}', event)"
            ondblclick="startFlowNodeInlineEdit(${idx}, '${n.id}', event)"
          >
            ${floatingToolbar}
            <span class="gb-flow-handle" style="${inStyle}" title="Điểm nối vào" data-port="in" data-node-id="${n.id}"></span>
            <div
              id="gb-fnode-lbl-${idx}-${n.id}"
              class="gb-flow-node-label"
              onblur="finishFlowNodeInlineEdit(${idx}, '${n.id}', this)"
              onkeydown="handleFlowNodeLabelKey(event, this)"
            >${n.label}</div>
            <span
              class="gb-flow-handle"
              style="${outStyle}"
              title="Kéo sang khối khác để nối mũi tên"
              data-port="out"
              data-node-id="${n.id}"
              onpointerdown="startFlowEdgeConnectDrag(${idx}, '${n.id}', event)"
            ></span>
          </div>
        `;
      }).join("");

      stage.innerHTML = `
        ${sgHtml}
        <svg class="gb-flow-edges-svg" width="${maxX}" height="${maxY}" viewBox="0 0 ${maxX} ${maxY}">
          <defs>
            <marker id="gb-flow-arrow-${idx}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"></path>
            </marker>
          </defs>
          ${edgesSvgGroups}
          <path id="gb-flow-temp-edge-${idx}" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4" d=""></path>
        </svg>
        ${nodesHtml}
        ${selectedEdgePopoverHtml}
      `;
    }

    function startFlowNodeDrag(idx, nodeId, ev) {
      if (ev.target.classList.contains("gb-flow-handle")) return;
      if (ev.target.closest(".gb-flow-node-toolbar")) return;
      const lblEl = document.getElementById(`gb-fnode-lbl-${idx}-${nodeId}`);
      if (lblEl && lblEl.getAttribute("contenteditable") === "true") return;

      const graph = flowCanvasStates[idx];
      if (!graph) return;
      const node = graph.nodes.find((n) => n.id === nodeId);
      if (!node) return;

      graph.selectedNodeId = nodeId;
      graph.selectedEdgeId = null;

      const nodeEl = document.getElementById(`gb-fnode-${idx}-${nodeId}`);
      const startX = ev.clientX;
      const startY = ev.clientY;
      const origX = node.x;
      const origY = node.y;
      let moved = false;

      if (nodeEl && nodeEl.setPointerCapture) {
        try { nodeEl.setPointerCapture(ev.pointerId); } catch (_) {}
      }

      const onMove = (moveEv) => {
        const dx = moveEv.clientX - startX;
        const dy = moveEv.clientY - startY;
        if (Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
        node.x = Math.max(12, Math.round(origX + dx));
        node.y = Math.max(12, Math.round(origY + dy));
        renderFlowCanvas(idx);
      };

      const onUp = () => {
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        if (!moved) {
          renderFlowCanvas(idx);
        } else {
          syncGraphToMermaidTextarea(idx);
        }
      };

      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
    }

    function startFlowNodeInlineEdit(idx, nodeId, ev) {
      if (ev) ev.stopPropagation();
      const lblEl = document.getElementById(`gb-fnode-lbl-${idx}-${nodeId}`);
      if (!lblEl) return;
      lblEl.setAttribute("contenteditable", "true");
      lblEl.focus();
      const range = document.createRange();
      range.selectNodeContents(lblEl);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function handleFlowNodeLabelKey(ev, el) {
      if (ev.key === "Enter" || ev.key === "Escape") {
        ev.preventDefault();
        el.blur();
      }
    }

    function finishFlowNodeInlineEdit(idx, nodeId, el) {
      el.removeAttribute("contenteditable");
      const graph = flowCanvasStates[idx];
      if (!graph) return;
      const node = graph.nodes.find((n) => n.id === nodeId);
      if (!node) return;
      const newText = cleanMermaidLabelText(el.textContent || "");
      if (newText) {
        node.label = newText;
        syncGraphToMermaidTextarea(idx);
      } else {
        el.textContent = node.label;
      }
    }

    function startFlowEdgeConnectDrag(idx, fromNodeId, ev) {
      ev.stopPropagation();
      ev.preventDefault();
      const graph = flowCanvasStates[idx];
      const stage = document.getElementById(`mmd-canvas-stage-${idx}`);
      const tempPath = document.getElementById(`gb-flow-temp-edge-${idx}`);
      if (!graph || !stage || !tempPath) return;

      const fromNode = graph.nodes.find((n) => n.id === fromNodeId);
      if (!fromNode) return;
      const p1 = getNodePortCoords(fromNode, "out", graph.direction);

      const onMove = (moveEv) => {
        const rect = stage.getBoundingClientRect();
        const x2 = moveEv.clientX - rect.left;
        const y2 = moveEv.clientY - rect.top;
        tempPath.setAttribute("d", buildBezierPath(p1.x, p1.y, x2, y2, graph.direction));
      };

      const onUp = (upEv) => {
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        tempPath.setAttribute("d", "");

        const hitEl = document.elementFromPoint(upEv.clientX, upEv.clientY);
        const targetNodeEl = hitEl ? hitEl.closest(".gb-flow-node") : null;
        if (targetNodeEl) {
          const toNodeId = targetNodeEl.dataset.nodeId;
          if (toNodeId && toNodeId !== fromNodeId) {
            const exists = graph.edges.some((e) => e.from === fromNodeId && e.to === toNodeId);
            if (!exists) {
              graph.edges.push({
                id: `e${Date.now()}`,
                from: fromNodeId,
                to: toNodeId,
                label: "",
                arrow: graph.kind === "sequence" ? "->>" : "-->"
              });
              syncGraphToMermaidTextarea(idx);
              renderFlowCanvas(idx);
            }
          }
        }
      };

      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
    }

    function selectFlowEdge(idx, edgeId, ev) {
      ev.stopPropagation();
      const graph = flowCanvasStates[idx];
      if (!graph) return;
      graph.selectedEdgeId = edgeId;
      graph.selectedNodeId = null;
      renderFlowCanvas(idx);
    }

    function updateFlowEdgeLabelInline(idx, edgeId, val) {
      const graph = flowCanvasStates[idx];
      if (!graph) return;
      const edge = graph.edges.find((e) => e.id === edgeId);
      if (!edge) return;
      edge.label = cleanMermaidLabelText(val);
      syncGraphToMermaidTextarea(idx);
    }

    function deleteFlowEdgeById(idx, edgeId, ev) {
      if (ev) ev.stopPropagation();
      const graph = flowCanvasStates[idx];
      if (!graph) return;
      graph.edges = graph.edges.filter((e) => e.id !== edgeId);
      graph.selectedEdgeId = null;
      syncGraphToMermaidTextarea(idx);
      renderFlowCanvas(idx);
    }

    function deleteFlowNodeById(idx, nodeId, ev) {
      if (ev) ev.stopPropagation();
      const graph = flowCanvasStates[idx];
      if (!graph) return;
      graph.nodes = graph.nodes.filter((n) => n.id !== nodeId);
      graph.edges = graph.edges.filter((e) => e.from !== nodeId && e.to !== nodeId);
      graph.selectedNodeId = null;
      syncGraphToMermaidTextarea(idx);
      renderFlowCanvas(idx);
    }

    function addConnectedFlowNode(idx, fromNodeId, shape = "rect", ev) {
      if (ev) ev.stopPropagation();
      const graph = flowCanvasStates[idx];
      if (!graph) return;
      graph.selectedNodeId = fromNodeId;
      addFlowCanvasNode(idx, shape);
    }

    function addFlowCanvasNode(idx, shape = "rect") {
      const graph = flowCanvasStates[idx];
      if (!graph) return;
      const newId = `B_${graph.nodes.length + 1}_${Math.floor(Math.random() * 90 + 10)}`;
      const refNode = graph.nodes.find((n) => n.id === graph.selectedNodeId) || graph.nodes[graph.nodes.length - 1];
      const newX = refNode ? (graph.direction === "LR" ? refNode.x + 214 : refNode.x) : 120;
      const newY = refNode ? (graph.direction === "LR" ? refNode.y : refNode.y + 82) : 60;

      graph.nodes.push({
        id: newId,
        label: shape === "diamond" ? "Điều kiện?" : "Bước mới",
        shape,
        subgraphId: refNode ? refNode.subgraphId : null,
        x: newX,
        y: newY,
        w: 180,
        h: 44
      });

      if (refNode) {
        graph.edges.push({
          id: `e_${Date.now()}`,
          from: refNode.id,
          to: newId,
          label: "",
          arrow: graph.kind === "sequence" ? "->>" : "-->"
        });
      }

      graph.selectedNodeId = newId;
      graph.selectedEdgeId = null;
      syncGraphToMermaidTextarea(idx);
      renderFlowCanvas(idx);
    }

    function deleteFlowCanvasSelection(idx) {
      const graph = flowCanvasStates[idx];
      if (!graph) return;
      if (graph.selectedNodeId) {
        deleteFlowNodeById(idx, graph.selectedNodeId);
      } else if (graph.selectedEdgeId) {
        deleteFlowEdgeById(idx, graph.selectedEdgeId);
      }
    }

    function autoLayoutFlowCanvas(idx) {
      const graph = flowCanvasStates[idx];
      if (!graph) return;
      computeFlowGraphLayout(graph);
      renderFlowCanvas(idx);
    }

    function toggleMermaidDirection(idx) {
      const graph = flowCanvasStates[idx];
      if (graph) {
        graph.direction = graph.direction === "LR" ? "TB" : "LR";
        computeFlowGraphLayout(graph);
        syncGraphToMermaidTextarea(idx);
        renderFlowCanvas(idx);
      }
      previewMermaidBlock(idx, false);
    }

    function switchMermaidEditorTab(idx, mode) {
      const canvasPane = document.getElementById(`mmd-canvas-pane-${idx}`);
      const codePane = document.getElementById(`mmd-code-pane-${idx}`);
      const btnCanvas = document.getElementById(`mmd-tab-canvas-${idx}`);
      const btnCode = document.getElementById(`mmd-tab-code-${idx}`);
      if (!canvasPane || !codePane) return;
      if (mode === "code") {
        canvasPane.classList.add("hidden");
        codePane.classList.remove("hidden");
        btnCode.className = "h-7 px-2.5 rounded-md bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 font-semibold text-[11px]";
        btnCanvas.className = "h-7 px-2.5 rounded-md text-slate-500 hover:text-slate-900 dark:hover:text-white text-[11px] font-medium";
        previewMermaidBlock(idx, false);
      } else {
        const ta = document.getElementById(`mmd-editor-${idx}`);
        if (ta) {
          flowCanvasStates[idx] = parseMermaidToFlowGraph(ta.value);
          renderFlowCanvas(idx);
        }
        codePane.classList.add("hidden");
        canvasPane.classList.remove("hidden");
        btnCanvas.className = "h-7 px-2.5 rounded-md bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 font-semibold text-[11px]";
        btnCode.className = "h-7 px-2.5 rounded-md text-slate-500 hover:text-slate-900 dark:hover:text-white text-[11px] font-medium";
      }
    }

    function activateMermaidBlockEditor(card, idx) {
      if (card.dataset.editingActive === "1") return;
      card.dataset.editingActive = "1";
      card.dataset.originalHtml = card.innerHTML;
      const rawCode = card.dataset.rawMermaid || "";

      card.classList.add("gb-block-editing", "flex-col");
      card.innerHTML = `
        <div class="w-full space-y-2.5">
          <div class="flex items-center justify-between gap-2 pb-2 border-b gb-border text-xs">
            <div class="inline-flex items-center p-0.5 rounded-lg border gb-border-strong gb-surface">
              <button type="button" id="mmd-tab-canvas-${idx}" onclick="switchMermaidEditorTab(${idx}, 'canvas')" class="h-6 px-2.5 rounded-md bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 font-semibold text-[11px]">
                Sơ đồ
              </button>
              <button type="button" id="mmd-tab-code-${idx}" onclick="switchMermaidEditorTab(${idx}, 'code')" class="h-6 px-2.5 rounded-md text-slate-500 hover:text-slate-900 dark:hover:text-white text-[11px] font-medium">
                Mã
              </button>
            </div>

            <div class="flex items-center gap-1">
              <button type="button" onclick="addFlowCanvasNode(${idx}, 'rect')" class="h-7 px-2 rounded-md border gb-border-strong hover:border-emerald-500 text-[11px] font-medium inline-flex items-center gap-1" title="Thêm bước mới">
                <svg class="w-3.5 h-3.5 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 9v6M9 12h6"/></svg>
                <span>Bước</span>
              </button>
              <button type="button" onclick="addFlowCanvasNode(${idx}, 'diamond')" class="h-7 px-2 rounded-md border gb-border-strong hover:border-emerald-500 text-[11px] font-medium inline-flex items-center gap-1" title="Thêm nhánh điều kiện">
                <svg class="w-3.5 h-3.5 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 22 12 12 22 2 12 12 2z"/></svg>
                <span>Nhánh</span>
              </button>
              <button type="button" onclick="toggleMermaidDirection(${idx})" class="h-7 w-7 rounded-md border gb-border-strong hover:border-emerald-500 inline-flex items-center justify-center" title="Đổi chiều Dọc / Ngang" aria-label="Đổi chiều Dọc / Ngang">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
              </button>
              <button type="button" onclick="autoLayoutFlowCanvas(${idx})" class="h-7 w-7 rounded-md border gb-border-strong hover:border-emerald-500 inline-flex items-center justify-center" title="Tự động căn đều" aria-label="Tự động căn đều">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
              </button>
            </div>

            <div class="flex items-center gap-1.5">
              <button type="button" onclick="commitMermaidBlock(${idx})" class="h-7 px-3 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-semibold">
                Lưu
              </button>
              <button type="button" onclick="cancelMermaidBlock(${idx})" class="h-7 w-7 rounded-lg border gb-border-strong text-slate-500 inline-flex items-center justify-center" title="Đóng" aria-label="Đóng">
                ✕
              </button>
            </div>
          </div>

          <div id="mmd-canvas-pane-${idx}">
            <div class="gb-flow-canvas-viewport" id="mmd-canvas-viewport-${idx}" onclick="clearFlowCanvasSelection(${idx}, event)">
              <div class="gb-flow-canvas-stage" id="mmd-canvas-stage-${idx}"></div>
            </div>
          </div>

          <div id="mmd-code-pane-${idx}" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-3 items-stretch">
            <textarea
              id="mmd-editor-${idx}"
              aria-label="Mã sơ đồ Mermaid"
              rows="13"
              oninput="previewMermaidBlock(${idx}, true)"
              class="w-full min-h-[300px] h-full p-3.5 rounded-xl border gb-border-strong gb-surface font-mono text-xs leading-relaxed focus:outline-none focus:ring-2 focus:ring-emerald-500"
            ></textarea>
            <div id="mmd-live-preview-${idx}" class="p-3.5 rounded-xl border gb-border bg-white dark:bg-slate-950 overflow-x-auto flex items-center justify-center min-h-[300px]"></div>
          </div>
        </div>
      `;
      const ta = document.getElementById(`mmd-editor-${idx}`);
      if (ta) {
        ta.value = rawCode;
        ta.onkeydown = (ev) => {
          if (ev.key === "Escape") {
            ev.preventDefault();
            cancelMermaidBlock(idx);
          } else if ((ev.metaKey || ev.ctrlKey) && (ev.key.toLowerCase() === "s" || ev.key === "Enter")) {
            ev.preventDefault();
            commitMermaidBlock(idx);
          }
        };
      }
      const g = parseMermaidToFlowGraph(rawCode);
      g.selectedNodeId = null;
      flowCanvasStates[idx] = g;
      renderFlowCanvas(idx);
    }

    function clearFlowCanvasSelection(idx, ev) {
      if (ev && (ev.target.closest(".gb-flow-node") || ev.target.closest(".gb-flow-edge-group") || ev.target.closest(".gb-flow-edge-popover"))) {
        return;
      }
      const graph = flowCanvasStates[idx];
      if (!graph) return;
      graph.selectedNodeId = null;
      graph.selectedEdgeId = null;
      renderFlowCanvas(idx);
    }

    async function previewMermaidBlock(idx) {
      const ta = document.getElementById(`mmd-editor-${idx}`);
      const previewEl = document.getElementById(`mmd-live-preview-${idx}`);
      if (!ta || !previewEl) return;
      try {
        const { svg } = await mermaid.render(`mmd-live-${Date.now()}-${idx}`, ta.value.trim());
        previewEl.innerHTML = svg;
        enhanceMermaidSvg(previewEl);
      } catch (_) {}
    }

    async function commitMermaidBlock(idx) {
      const blocks = getEditableBlockElements();
      const card = blocks[idx];
      if (!card) return;
      const ta = document.getElementById(`mmd-editor-${idx}`);
      const newCode = ta ? ta.value.trim() : (card.dataset.rawMermaid || "");
      card.dataset.rawMermaid = newCode;
      delete card.dataset.editingActive;
      delete card.dataset.originalHtml;
      card.classList.remove("gb-block-editing", "flex-col");

      try {
        const { svg } = await mermaid.render(`mmd-saved-${Date.now()}-${idx}`, newCode);
        card.innerHTML = `<div class="gb-mermaid-svg-wrap w-full overflow-x-auto flex justify-center">${svg}</div>`;
        enhanceMermaidSvg(card);
      } catch (_) {}

      decorateEditableBlocks();
      await saveEditedMarkdown(true);
    }

    function cancelMermaidBlock(idx) {
      const blocks = getEditableBlockElements();
      const card = blocks[idx];
      if (!card) return;
      if (card.dataset.originalHtml !== undefined) {
        card.innerHTML = card.dataset.originalHtml;
      }
      delete card.dataset.editingActive;
      delete card.dataset.originalHtml;
      card.classList.remove("gb-block-editing", "flex-col");
      decorateEditableBlocks();
    }

    function inlineNodeToMarkdown(node) {
      if (!node) return "";
      if (node.nodeType === Node.TEXT_NODE) {
        return node.nodeValue || "";
      }
      if (node.nodeType !== Node.ELEMENT_NODE) return "";
      if (node.classList.contains("gb-block-edit-btn")) return "";

      const tag = node.tagName.toLowerCase();
      if (tag === "ul" || tag === "ol") return "";
      const inner = Array.from(node.childNodes).map(inlineNodeToMarkdown).join("");
      if (tag === "strong" || tag === "b") return `**${inner.trim()}**`;
      if (tag === "em" || tag === "i") return `*${inner.trim()}*`;
      if (tag === "code") return `\`${inner.trim()}\``;
      if (tag === "a") {
        const href = node.dataset.rawHref || node.getAttribute("href") || "#";
        return `[${inner.trim()}](${href})`;
      }
      if (tag === "br") return "<br/>";
      if (tag === "p") return `${inner.trim()}\n`;
      return inner;
    }

    function listNodeToMarkdown(listEl, indent = "") {
      const isOrdered = listEl.tagName.toLowerCase() === "ol";
      const lines = [];
      Array.from(listEl.querySelectorAll(":scope > li")).forEach((li, i) => {
        const bullet = isOrdered ? `${i + 1}.` : "-";
        const text = inlineNodeToMarkdown(li).replace(/\n+/g, " ").trim();
        lines.push(`${indent}${bullet} ${text}`);
        Array.from(li.querySelectorAll(":scope > ul, :scope > ol")).forEach((sub) => {
          lines.push(listNodeToMarkdown(sub, indent + "  "));
        });
      });
      return lines.join("\n");
    }

    function serializeArticleToMarkdown() {
      const articleEl = document.getElementById("gitbook-article");
      if (!articleEl) return currentRawMarkdown;
      const out = [];

      Array.from(articleEl.children).forEach((el) => {
        if (el.classList.contains("gb-wysiwyg-toolbar")) return;
        const tag = el.tagName.toLowerCase();

        if (el.classList.contains("gb-doc-meta")) {
          const today = new Date().toISOString().slice(0, 10);
          const author = currentUserEmail || "srs-studio";
          out.push(`> **Last Updated At:** ${today} **Updated By:** ${author}`);
          return;
        }

        if (el.classList.contains("gb-mermaid-card")) {
          const rawMmd = (el.dataset.rawMermaid || "").trim();
          if (rawMmd) {
            out.push("```mermaid\n" + rawMmd + "\n```");
          }
          return;
        }

        if (el.classList.contains("gb-table-block") || tag === "table") {
          const tbl = tag === "table" ? el : el.querySelector("table");
          if (!tbl) return;
          const rows = Array.from(tbl.querySelectorAll("tr"));
          if (!rows.length) return;
          const mdRows = rows.map((tr) => {
            const cells = Array.from(tr.querySelectorAll("th, td")).map((c) =>
              inlineNodeToMarkdown(c).replace(/\s*\n\s*/g, " ").trim()
            );
            return `| ${cells.join(" | ")} |`;
          });
          const colCount = rows[0].querySelectorAll("th, td").length || 1;
          const sep = `| ${Array(colCount).fill("---").join(" | ")} |`;
          mdRows.splice(1, 0, sep);
          out.push(mdRows.join("\n"));
          return;
        }

        if (/^h[1-6]$/.test(tag)) {
          const level = Number(tag.slice(1));
          out.push(`${"#".repeat(level)} ${inlineNodeToMarkdown(el).trim()}`);
          return;
        }

        if (tag === "p") {
          out.push(inlineNodeToMarkdown(el).trim());
          return;
        }

        if (tag === "ul" || tag === "ol") {
          out.push(listNodeToMarkdown(el));
          return;
        }

        if (tag === "blockquote") {
          const text = inlineNodeToMarkdown(el).trim();
          out.push(
            text
              .split(/\n+/)
              .map((line) => `> ${line.trim()}`)
              .join("\n>\n")
          );
          return;
        }

        if (tag === "pre") {
          const codeEl = el.querySelector("code");
          const raw = codeEl ? codeEl.textContent : el.textContent;
          out.push("```\n" + (raw || "").trim() + "\n```");
          return;
        }

        if (tag === "hr") {
          out.push("---");
        }
      });

      return out.filter(Boolean).join("\n\n") + "\n";
    }

    async function saveEditedMarkdown(keepEditMode = false) {
      const newMd = serializeArticleToMarkdown();
      const btn = document.getElementById("btn-save-md");
      const statusEl = document.getElementById("edit-save-status");
      if (btn) btn.textContent = "Đang lưu...";
      try {
        let saveOk = false;
        if (typeof STUDIO_CONFIG.onSaveDoc === "function") {
          await STUDIO_CONFIG.onSaveDoc({ path: currentDocPath, content: newMd, author: currentUserEmail });
          saveOk = true;
        } else if (STUDIO_CONFIG.embeddedDocs && !WORKER_API_BASE) {
          STUDIO_CONFIG.embeddedDocs[currentDocPath] = newMd;
          saveOk = true;
        } else {
          const resp = await fetch(`${WORKER_API_BASE}/api/srs-book/doc`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json"
            },
            credentials: "include",
            body: JSON.stringify({ path: currentDocPath, content: newMd })
          });
          saveOk = resp.ok;
        }
        if (saveOk) {
          if (STUDIO_CONFIG.embeddedDocs) {
            STUDIO_CONFIG.embeddedDocs[currentDocPath] = newMd;
          }
          currentRawMarkdown = newMd;
          const nowStr = new Date().toTimeString().slice(0, 5);
          if (statusEl) {
            statusEl.textContent = `(Đã lưu lúc ${nowStr})`;
          }
          if (!keepEditMode) {
            isBlockEditMode = false;
            document.getElementById("markdown-editor-box").classList.add("hidden");
            updateEditModeButtonUI();
            await renderMarkdownIntoArticle(currentRawMarkdown);
          }
        }
      } finally {
        if (btn) btn.textContent = "Lưu thay đổi";
      }
    }

    window.SrsWebviewStudio = {
      version: "1.0.0",
      config: STUDIO_CONFIG,
      configure(overrides = {}) {
        Object.assign(STUDIO_CONFIG, overrides);
        applyStudioBranding();
        return this;
      },
      openDoc: (docPath) => openDoc(docPath),
      getCurrentPath: () => currentDocPath,
      getMarkdown: () => serializeArticleToMarkdown(),
      setMarkdown: (md) => renderMarkdownIntoArticle(md),
      toggleEditMode: () => toggleEditPage(),
      save: (keepEditMode = false) => saveEditedMarkdown(keepEditMode),
      parseMermaidToFlowGraph: (raw) => parseMermaidToFlowGraph(raw),
      serializeFlowGraphToMermaid: (graph) => serializeFlowGraphToMermaid(graph)
    };

    function updateCommentBadges() {}

    function handleSearchFilter(val) {
      searchFilter = val || "";
      renderSidebarTree();
    }

    async function toggleTheme() {
      document.documentElement.classList.toggle("dark");
      configureMermaidTheme();
      if (currentRawMarkdown) {
        await renderMarkdownIntoArticle(currentRawMarkdown);
      }
    }

    window.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        document.getElementById("gb-search-input").focus();
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      checkAuthAndBoot();
    });
  </script>
